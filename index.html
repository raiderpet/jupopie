<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Welcome to jupopie.space">
  <title>jupopie.space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f14;
      --text: #e8edf4;
      --text-muted: #8b9cb3;
      --accent: #2dd4bf;
      --border: #1e2a3a;
      --bg-card: #151c26;
    }

    [data-theme="light"] {
      --bg: #f4f7fb;
      --text: #1a2332;
      --text-muted: #5a6b82;
      --accent: #0d9488;
      --border: #dde4ee;
      --bg-card: #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      transition: background 0.25s, color 0.25s;
    }

    .theme-switch {
      position: fixed;
      top: 1rem;
      right: 1rem;
      display: inline-flex;
      padding: 0.25rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
    }

    .theme-switch-option {
      padding: 0.35rem 0.65rem;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .theme-switch-option.active {
      background: var(--accent);
      color: #0b0f14;
    }

    [data-theme="light"] .theme-switch-option.active { color: #ffffff; }

    h1 {
      margin: 0;
      padding: 1.5rem;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="theme-switch" role="group" aria-label="Choose color theme">
    <button type="button" class="theme-switch-option" id="themeLight" aria-pressed="false">☀ Light</button>
    <button type="button" class="theme-switch-option" id="themeDark" aria-pressed="true">☾ Dark</button>
  </div>

  <h1>Welcome to Jupopie Space</h1>

  <script>
    const themeLight = document.getElementById('themeLight');
    const themeDark = document.getElementById('themeDark');
    const html = document.documentElement;

    function setTheme(theme) {
      html.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      const isDark = theme === 'dark';
      themeLight.classList.toggle('active', !isDark);
      themeDark.classList.toggle('active', isDark);
      themeLight.setAttribute('aria-pressed', String(!isDark));
      themeDark.setAttribute('aria-pressed', String(isDark));
    }

    setTheme(localStorage.getItem('theme') || 'dark');
    themeLight.addEventListener('click', () => setTheme('light'));
    themeDark.addEventListener('click', () => setTheme('dark'));
  </script>
</body>
</html>
